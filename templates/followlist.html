{% extends "base.html" %}
{% block content %}
<div style="padding: 16px 0;">
  <h2 style="font-family:'Fraunces',serif; color:#F4EFE6; font-size:19px; margin:0 0 12px; padding:0 18px;">{{ title }} · {{ profile_user.username }}</h2>

  {% if people %}
  {% for u in people %}
  <a href="/profile/{{ u.username }}" style="display:flex; align-items:center; gap:10px; padding:10px 18px;">
    {% if u.profile_pic %}
    <img src="{{ u.profile_pic }}" style="width:38px; height:38px; border-radius:50%; object-fit:cover;">
    {% else %}
    <div style="width:38px; height:38px; border-radius:50%; background:{{ u.theme_color }}; display:flex; align-items:center; justify-content:center; color:#100E13; font-weight:700; font-size:13px;">{{ u.username[:2]|upper }}</div>
    {% endif %}
    <span style="color:#F4EFE6; font-size:14px;">{{ u.username }}</span>
  </a>
  {% endfor %}
  {% else %}
  <p style="color:#9A94A0; text-align:center; padding:32px 18px;">Nobody here yet.</p>
  {% endif %}
</div>
{% endblock %}
