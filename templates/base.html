<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lufrica</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body style="background:#100E13; margin:0; font-family:'Manrope',sans-serif;">
<div class="app-shell">
  {% if current_user %}
  <header class="topbar">
    <a href="/" class="logo">
      <span class="wordmark">Lufrica</span>
    </a>
    <div class="topbar-right">
      <a href="/notifications" class="icon-link" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </a>
      <a href="/messages" class="icon-link" aria-label="Messages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      </a>
      <a href="/profile" class="icon-link" aria-label="Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 6-6 8-6s6.5 2 8 6"/></svg>
      </a>
    </div>
  </header>
  {% endif %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% if current_user %}
  <nav class="bottomnav">
    <a href="/feed" class="navlink {{ 'active' if active_tab == 'feed' }}" aria-label="Home">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12l9-9 9 9v9H3z"/></svg>
    </a>
    <a href="/explore" class="navlink {{ 'active' if active_tab == 'explore' }}" aria-label="Explore">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </a>
    <a href="/create" class="navlink {{ 'active' if active_tab == 'create' }}" aria-label="Create">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
    </a>
    <a href="/reels" class="navlink {{ 'active' if active_tab == 'reels' }}" aria-label="Reels">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </a>
  </nav>
  {% endif %}
</div>
<style>
.app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #100E13; position: relative; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #2C2830; position: sticky; top: 0; background: #100E13; z-index: 5; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #F4EFE6; }
.wordmark { font-family: 'Alex Brush', cursive; font-size: 28px; line-height: 1; }
.topbar-right { display: flex; gap: 12px; }
.icon-link { display: flex; align-items: center; color: #F4EFE6; text-decoration: none; }
.icon-link:hover { color: #D4A017; }
.content { flex: 1; padding-bottom: 76px; overflow-y: auto; }
.bottomnav { position: fixed; bottom: 0; width: 100%; max-width: 480px; display: flex; justify-content: space-around; padding: 8px 0; background: #100E13; border-top: 1px solid #2C2830; }
.navlink { color: #9A94A0; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 100%; padding: 8px 0; }
.navlink.active { color: #D4A017; }
.navlink:hover { color: #D4A017; }
</style>
<script src="/static/app.js"></script>
</body>
</html>
