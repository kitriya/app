{% extends "base.html" %}
{% block content %}
<div style="padding: 16px 0;">
  <h2 style="font-family:'Fraunces',serif; color:#F4EFE6; font-size:19px; margin:0 0 12px; padding:0 18px;">#{{ tag }}</h2>

  {% if posts %}
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:2px;">
    {% for post in posts %}
    <a href="/post/{{ post.id }}" style="aspect-ratio:1/1; display:block; position:relative; background:#1B181F;">
      {% if post.media_paths %}
      <img src="{{ post.media_paths[0] }}" class="lf-filter-{{ post.filter_name }}" style="width:100%; height:100%; object-fit:cover;">
      {% endif %}
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p style="color:#9A94A0; text-align:center; padding:32px 18px;">No posts with #{{ tag }} yet.</p>
  {% endif %}
</div>
{% endblock %}
