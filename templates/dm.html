{% extends "base.html" %}
{% block content %}
<div style="display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid #2C2830;">
  {% if other_user.profile_pic %}
  <img src="{{ other_user.profile_pic }}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
  {% else %}
  <div style="width:32px; height:32px; border-radius:50%; background:{{ other_user.theme_color }}; display:flex; align-items:center; justify-content:center; color:#100E13; font-weight:700; font-size:12px;">{{ other_user.username[:2]|upper }}</div>
  {% endif %}
  <span style="color:#F4EFE6; font-weight:700; font-size:14.5px;">{{ other_user.username }}</span>
</div>

<div style="padding: 16px 18px; display:flex; flex-direction:column; gap:8px; min-height:300px;">
  {% for m in messages %}
  <div style="max-width:75%; align-self:{{ 'flex-end' if m.sender_id == current_user.id else 'flex-start' }}; background:{{ '#D4A017' if m.sender_id == current_user.id else '#1B181F' }}; color:{{ '#100E13' if m.sender_id == current_user.id else '#F4EFE6' }}; padding:9px 13px; border-radius:14px; font-size:14px;">
    {{ m.body }}
  </div>
  {% else %}
  <p style="color:#9A94A0; text-align:center; margin-top:40px;">Say hi to {{ other_user.username }}.</p>
  {% endfor %}
</div>

<form method="post" action="/send-message/{{ other_user.id }}" style="position:fixed; bottom:0; width:100%; max-width:480px; display:flex; gap:8px; padding:12px 16px; background:#100E13; border-top:1px solid #2C2830;">
  <input type="text" name="body" placeholder="Message..." required style="flex:1; background:#1B181F; border:1px solid #2C2830; border-radius:20px; padding:10px 16px; color:#F4EFE6; font-size:14px;">
  <button type="submit" style="background:#D4A017; color:#100E13; border:none; border-radius:20px; padding:0 18px; font-weight:700; font-size:14px;">Send</button>
</form>
{% endblock %}
